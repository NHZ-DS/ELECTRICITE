[project]
name = "gridcast-fr"
version = "0.1.0"
description = "Day-ahead forecasting of French electricity consumption with calibrated uncertainty and drift monitoring"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
